name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pin the GITHUB_TOKEN ceiling in-repo. The repository default is already read-only, so this
# changes nothing today; it keeps a future settings flip, or a job added to this file later,
# from silently gaining write. The validator only reads the checkout.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Validate plugin, manifests, skills, agents, and commands
        run: node scripts/validate-plugin.mjs
