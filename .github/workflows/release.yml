name: Release

# This is a Kiro Crew app distributed by install-from-source — `kirocrew app install <path>`
# from a clone of this git repo (or via an external registry that points at the repo). There is
# no package registry to publish to. This workflow only turns a pushed version tag into a visible
# GitHub Release with the changelog notes, after re-running the validator and enforcing that the
# tag matches the app.json manifest version.
#
# Release flow: bump app.json (the sole version source of truth) + add a dated CHANGELOG section,
# commit to main, then `git tag vX.Y.Z && git push --tags`. This runs on the tag.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate app manifest, skills, and agents
        run: node scripts/validate-app.mjs

      - name: Verify the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest=$(node -p "require('./app.json').version")
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $tag (version $version) does not match app.json version $manifest — bump the manifest before tagging."
            exit 1
          fi
          echo "tag $tag matches app.json version $manifest"

      # Notes go to a FILE, not a step output. Writing them through $GITHUB_OUTPUT needs a heredoc
      # delimiter, and a fixed one is forgeable by a changelog line that happens to equal it. A file
      # sidesteps the question entirely and matches how rutherford-mcp-server's release workflow does it.
      - name: Extract changelog entry
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Print the section between '## [<version>]' and the next section or link
          # definition. Literal prefix match (index), not regex — the header contains '['/'.'.
          awk -v v="## [$version]" '
            index($0, v) == 1 {flag=1; next}
            flag && /^## \[/ {exit}
            flag && /^\[[^][]+\]: / {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::No CHANGELOG section found for version $version — add a '## [$version]' entry before tagging."
            exit 1
          fi

      # Derive the GitHub Release `prerelease` flag from the PRESENCE of a SemVer prerelease
      # component, not from an allowlist of labels. The manifest validator's SEMVER accepts ANY
      # prerelease identifier (e.g. 1.0.1-preview.1, 1.0.1-next.3), so keying off -rc/-alpha/-beta
      # alone would publish a tag like v1.0.1-preview.1 as a STABLE release.
      #
      # SemVer grammar: MAJOR.MINOR.PATCH[-prerelease][+build]. The prerelease component is the
      # `-<identifiers>` that follows PATCH and precedes any `+build`. So:
      #   1. strip the leading `v`,
      #   2. drop any `+build` metadata (a `-` inside build metadata is NOT a prerelease marker),
      #   3. prerelease is present iff what remains still contains a `-`.
      # Shell-injection-safe: the tag is read from the $GITHUB_REF_NAME environment variable, never
      # spliced in via ${{ }} interpolation in a run: block.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"          # strip leading v: v1.0.1-preview.1 -> 1.0.1-preview.1
          core="${version%%+*}"       # drop +build metadata: 1.0.1-preview.1+ci -> 1.0.1-preview.1
          if [ "$core" != "${core#*-}" ]; then
            # A '-' survives after removing build metadata => a prerelease component is present.
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "tag $tag has a SemVer prerelease component -> prerelease=true"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "tag $tag is a stable release -> prerelease=false"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}
